name: Scheduled LocalVulnAI

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m localvulnai scan --path . --no-ai -o report.sarif -f sarif
      - uses: actions/upload-artifact@v4
        with:
          name: localvulnai-report
          path: report.sarif
